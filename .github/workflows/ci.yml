name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: macOS
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release policy tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Show tool versions
        run: |
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          [[ "$xcode_version" == 'Xcode 27.'* ]]
          swift --version

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Test
        run: make test

      - name: Build
        run: swift build -c release

      - name: Package app bundle
        run: make app

      - name: Verify archived app dependencies
        run: |
          source version.env
          mkdir -p "$RUNNER_TEMP/blackbar-archive"
          ditto -x -k "BlackBar-$MARKETING_VERSION.zip" "$RUNNER_TEMP/blackbar-archive"
          Scripts/verify_app_bundle.sh "$RUNNER_TEMP/blackbar-archive/BlackBar.app" --universal

      - name: Validate bundle metadata
        run: |
          test -x build/BlackBar.app/Contents/MacOS/BlackBar
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/BlackBar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/BlackBar.app/Contents/Info.plist
