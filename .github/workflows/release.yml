name: Release
run-name: Release ${{ inputs.tag || github.ref_name }} (dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }})

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, notarize, and verify without publishing
        type: boolean
        default: true
      tag:
        description: Existing signed annotated tag (required only when publishing)
        type: string
        default: ''

permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
      dry_run: ${{ steps.validate.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require Homebrew handoff credentials for publication
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          TAP_TOKEN_PRESENT: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: test "$TAP_TOKEN_PRESENT" = true
      - name: Validate immutable source and exact-commit push CI
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Dispatch must use the default main branch' >&2
            exit 1
          fi
          python3 .github/scripts/release.py validate
          mv release-notes.md RELEASE-NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-notes
          path: RELEASE-NOTES.md
          if-no-files-found: error

  availability:
    needs: validate
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub requires push access to include draft releases.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Refuse existing releases, including drafts, before building
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: 'false'
        run: python3 .github/scripts/release.py availability

  macos:
    needs: [validate, availability]
    if: always() && needs.validate.result == 'success' && (needs.availability.result == 'success' || needs.validate.outputs.dry_run == 'true')
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Verify Xcode 27 and Rosetta
        run: |
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          [[ "$xcode_version" == 'Xcode 27.'* ]]
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
      - name: Test
        run: |
          make test
      - name: Install packaging tools
        run: true
      - name: Import personal Developer ID into an ephemeral keychain
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: .github/scripts/setup-signing.sh
      - name: Build, sign, notarize, and staple
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: Scripts/sign-and-notarize.sh
      - name: Verify the packed app and sign the Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          source version.env
          mkdir -p release-assets "$RUNNER_TEMP/extracted"
          cp BlackBar-${MARKETING_VERSION}*.zip release-assets/
          true
          ditto -x -k "release-assets/BlackBar-${MARKETING_VERSION}.zip" "$RUNNER_TEMP/extracted"
          python3 .github/scripts/verify-macos.py "$RUNNER_TEMP/extracted/BlackBar.app"
          export APP_BUNDLE="$RUNNER_TEMP/extracted/BlackBar.app"
          SPARKLE_SIGN_UPDATE="$(find .build/artifacts -type f -name sign_update -print -quit)"
          export SPARKLE_SIGN_UPDATE
          test -x "$SPARKLE_SIGN_UPDATE"
          python3 .github/scripts/release.py appcast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload-macos
          path: release-assets/*
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"


  assemble:
    needs: [validate, macos]
    if: always() && needs.validate.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          merge-multiple: true
          path: release-assets
      - name: Enforce complete shipping inventory and checksum every asset
        run: python3 .github/scripts/release.py inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-${{ needs.validate.outputs.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, assemble]
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ needs.validate.outputs.sha }}
          path: release-assets
      - name: Publish verified draft and the signed Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ needs.validate.outputs.dry_run }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 .github/scripts/release.py publish
      - name: Hand off Homebrew update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 .github/scripts/homebrew.py
